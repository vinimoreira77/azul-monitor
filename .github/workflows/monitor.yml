name: Monitorar Azul Pelo Mundo

on:
  schedule:
    # Roda todo dia às 10:00 AM UTC (ajuste conforme necessário)
    - cron: '0 10 * * *'
  
  # Permite rodar manualmente via GitHub UI
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar scraper
        run: python scraper.py

      - name: Fazer commit das mudanças
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/flights.json
          git commit -m "Atualização automática: $(date)" || true
          git push